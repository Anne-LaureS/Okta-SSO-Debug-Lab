name: OIDC client_credentials proof (Okta, private_key_jwt)

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"

jobs:
  private-key-jwt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Obtain a token via private_key_jwt against the real Okta org
        working-directory: iam-debug/oidc/.keys-lab
        run: |
          echo "$OKTA_PRIVATE_KEY" > private.pem
          bash get-token-pkjwt.sh > /tmp/token-response.json
          cat /tmp/token-response.json
        env:
          OKTA_DOMAIN: integrator-5794983.okta.com
          OKTA_CLIENT_ID: ${{ secrets.OKTA_CLIENT_ID }}
          OKTA_PRIVATE_KEY: ${{ secrets.OKTA_PRIVATE_KEY }}
          KID: iam-debug-lab-key-1
          CLIENT_ID: ${{ secrets.OKTA_CLIENT_ID }}

      - name: Verify the token is real, valid and correctly scoped
        run: |
          python3 - <<'EOF'
          import json, base64, time

          with open("/tmp/token-response.json") as f:
              data = json.load(f)

          assert "access_token" in data, f"no access_token in response: {data}"
          token = data["access_token"]

          parts = token.split(".")
          assert len(parts) == 3, "access_token is not a JWT (expected 3 segments)"

          def b64url_decode(seg):
              seg += "=" * (-len(seg) % 4)
              return base64.urlsafe_b64decode(seg)

          payload = json.loads(b64url_decode(parts[1]))

          assert payload["cid"] == "${{ secrets.OKTA_CLIENT_ID }}", "cid does not match our client_id"
          assert "okta.users.read" in payload["scp"], f"missing expected scope: {payload['scp']}"
          assert payload["exp"] > time.time(), "token is already expired"

          print("OK — real Okta access_token, valid, correctly scoped:")
          print(json.dumps(payload, indent=2))
          EOF

      - name: Clean up private key
        if: always()
        run: rm -f iam-debug/oidc/.keys-lab/private.pem
