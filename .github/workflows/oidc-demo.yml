name: OIDC client_credentials demo (Auth0)

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"

jobs:
  run-collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run OIDC client_credentials flow against Auth0
        working-directory: iam-debug
        run: |
          bru run auth0-demo \
            --env auth0-demo \
            --env-var client_id="$AUTH0_CLIENT_ID" \
            --env-var client_secret="$AUTH0_CLIENT_SECRET" \
            --reporter-junit ../reports/auth0-demo.xml
        env:
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth0-demo-report
          path: reports/auth0-demo.xml
